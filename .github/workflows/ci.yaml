name: CI frontend cine

on:
  push:
    branches:
      - main

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/frontend-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: instalar-dependencias
        run: npm ci --legacy-peer-deps

      - name: verificar-tipos-y-lint
        run: |
          npm run typecheck
          npm run lint

      - name: verificar-build
        env:
          VITE_CINE_API_URL: http://client-cine-upea.bo/api/v1
        run: npm run build -- --mode production

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker-build
        run: |
          docker build \
            --build-arg VITE_CINE_API_URL=${{ vars.VITE_CINE_API_URL || 'http://client-cine-upea.bo/api/v1' }} \
            -t ${{ env.IMAGEN }} .

      - name: docker-push
        run: |
          docker push ${{ env.IMAGEN }}
          echo "Imagen frontend subida a Docker Hub: ${{ env.IMAGEN }}"
